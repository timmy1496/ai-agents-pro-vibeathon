# Синтетичний сервіс-каталог демо-стенду. Джерело правди для tool get_service/list_services.
services:
  - name: demo-chaos-svc
    tier: 1
    language: python
    owner: team-orders
    slack_channel: "#team-orders"
    deps: [orders-db, payment-gateway]
    dashboards: ["http://localhost:3000/d/demo-chaos-svc"]
    runbook: kb/runbooks/high-error-rate.md
    slo: { availability: 99.9, latency_p95_ms: 300 }
    repo: github.com/timmy1496/demo-chaos-svc

  - name: checkout-api
    tier: 1
    language: go
    owner: team-checkout
    slack_channel: "#team-checkout"
    deps: [cart-service, payment-gateway, user-profile]
    dashboards: ["http://localhost:3000/d/checkout-api"]
    runbook: kb/runbooks/high-latency.md
    slo: { availability: 99.95, latency_p95_ms: 250 }
    repo: github.com/timmy1496/checkout-api

  - name: payment-gateway
    tier: 1
    language: go
    owner: team-payments
    slack_channel: "#team-payments"
    deps: [payments-db, stripe-api]
    dashboards: ["http://localhost:3000/d/payment-gateway"]
    runbook: kb/runbooks/dependency-down.md
    slo: { availability: 99.99, latency_p95_ms: 400 }
    repo: github.com/timmy1496/payment-gateway

  - name: cart-service
    tier: 1
    language: node
    owner: team-checkout
