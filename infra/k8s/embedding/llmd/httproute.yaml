# /v1/embeddings через той самий шлюз, що й LLM-пули (ADR-0011: один вхід на всі моделі).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-embed
spec:
  parentRefs:
    - name: llm-d-inference-gateway
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/embeddings}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-embed
