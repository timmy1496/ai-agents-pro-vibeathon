groups:
  - name: golden-signals
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / clamp_min(sum by (service) (rate(http_requests_total[1m])), 0.001) > 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: error rate {{ $value | humanizePercentage }} (>5%)"
          runbook_url: "kb/runbooks/high-error-rate.md"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[2m]))) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: p95 latency {{ $value }}s (>1s)"
          runbook_url: "kb/runbooks/high-latency.md"

      - alert: FrequentRestarts
        expr: changes(process_start_time_seconds{service!=""}[10m]) > 2
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: {{ $value }} restarts in 10m"
          runbook_url: "kb/runbooks/oomkilled-restarts.md"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{service!=""} > 180e6
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: RSS {{ $value | humanize1024 }}B near limit"
          runbook_url: "kb/runbooks/oomkilled-restarts.md"
