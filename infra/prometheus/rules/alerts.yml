# Вікна навмисно вичавлені до мінімуму: на демо алерт має спрацювати за секунди.
# 15s при scrape_interval 5s — це три семпли, менше вже не має сенсу: rate() почне
# стрибати від одиничного запиту. for: 0s прибирає ще десять секунд очікування.
#
# У проді так робити не можна: короткі вікна плюс for: 0s дають шумні алерти на кожен
# випадковий сплеск. Продові значення — [1m]..[5m] і for: 2m..5m; там затримка в кілька
# хвилин купує тишу вночі. Тут ми навмисно міняємо тишу на швидкість показу.
groups:
  - name: golden-signals
    interval: 5s
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[15s]))
            / clamp_min(sum by (service) (rate(http_requests_total[15s])), 0.001) > 0.05
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: error rate {{ $value | humanizePercentage }} (>5%)"
          runbook_url: "kb/runbooks/high-error-rate.md"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[15s]))) > 1
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: p95 latency {{ $value }}s (>1s)"
          runbook_url: "kb/runbooks/high-latency.md"

      - alert: FrequentRestarts
        expr: changes(process_start_time_seconds{service!=""}[10m]) > 2
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }}: {{ $value }} restarts in 10m"
          runbook_url: "kb/runbooks/oomkilled-restarts.md"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{service!=""} > 180e6
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: RSS {{ $value | humanize1024 }}B near limit"
          runbook_url: "kb/runbooks/oomkilled-restarts.md"
