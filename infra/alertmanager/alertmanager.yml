global:
  resolve_timeout: 1m

route:
  receiver: sre-agent
  group_by: [alertname, service]
  # group_wait — це пауза на догрупування схожих алертів перед першою відправкою.
  # Для демо 2s: далі чекати нічого, у нас один сервіс.
  group_wait: 2s
  group_interval: 15s
  # 1m, а не типові 4h: на демо алерт часто вже горить із попереднього прогону, і при
  # довгому repeat_interval Alertmanager мовчить — виглядає як зламана інтеграція.
  # Журнал нотифікацій живе у файловій системі контейнера і переживає `restart`,
  # тому саме коротким інтервалом це й лікується. У проді 4h рятує від спаму.
  repeat_interval: 1m

receivers:
  - name: sre-agent
    webhook_configs:
      # агент бігає на хості (make agent -> uvicorn на :8000)
      - url: http://host.docker.internal:8000/webhook/alert
        send_resolved: true
        # Вхід агента закритий спільним секретом. Значення має збігатись з AGENT_TOKEN
        # у .env; дефолт демонстраційний і задокументований у README.
        http_config:
          authorization:
            type: Bearer
            credentials: sre-demo-token
