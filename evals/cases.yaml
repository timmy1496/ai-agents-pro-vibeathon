      latency_p95: {current: [2.0, 2.0], baseline: [0.18]}
      rps: {current: [120.0], baseline: [125.0]}
      restarts: {current: [0], baseline: [0]}
      memory_bytes: {current: [300000000], baseline: [298000000]}
    logs: [{msg: "dial tcp payments-db:5432: i/o timeout", count: 500}]
