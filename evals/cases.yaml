# Датасет евалів. kind: rca | kb | policy
# fixtures.metrics.<signal>.{current,baseline} — записані ряди; logs — {msg,count,level}.

# ---------- реліз ----------
- id: rel-01
  kind: rca
  intent: ALERT
  service: demo-chaos-svc
  input: "HighErrorRate critical на demo-chaos-svc: error rate 34% (>5%)"
  expected_root_cause: release
  expect_tools: [get_service, golden_signals, query_loki_patterns, get_deploys]
  fixtures:
    metrics:
      error_rate: {current: [0.01, 0.28, 0.35, 0.34], baseline: [0.001, 0.002]}
      latency_p95: {current: [0.12, 0.13], baseline: [0.11, 0.12]}
      rps: {current: [5.0, 5.0], baseline: [5.0]}
      restarts: {current: [0], baseline: [0]}
      memory_bytes: {current: [92000000], baseline: [90000000]}
    logs:
      - {msg: "unhandled exception in order handler: NullPointer on payment_ref", count: 180}
      - {msg: "request failed", count: 180}
    deploys: [{minutes_ago: 4, version: "1.5.0", author: olena}]
    k8s_events: [{minutes_ago: 4, reason: Created, type: Normal, message: "Created container chaos-svc"}]

- id: rel-02
  kind: rca
  intent: ALERT
  service: checkout-api
  input: "HighLatencyP95 на checkout-api: p95 1.8s, тримається 5 хвилин"
  expected_root_cause: release
  expect_tools: [get_service, golden_signals, get_deploys, similar_incidents]
  fixtures:
    metrics:
      error_rate: {current: [0.004, 0.006], baseline: [0.003]}
      latency_p95: {current: [0.25, 1.4, 1.8], baseline: [0.24, 0.25]}
      rps: {current: [40.0, 41.0], baseline: [40.0]}
      restarts: {current: [0], baseline: [0]}
      memory_bytes: {current: [210000000], baseline: [205000000]}
    # Лог має вказувати на власний код, а не на залежність: інакше кейс двозначний
    # і "dependency" стає такою ж чесною відповіддю, як еталонний "release".
    logs: [{msg: "pricing rules evaluation took 1680ms in checkout handler", count: 60, level: warn}]
    deploys: [{minutes_ago: 6, version: "2.13.0", author: maks}]

# ---------- залежність ----------
- id: dep-01
  kind: rca
  intent: ALERT
  service: demo-chaos-svc
  input: "HighLatencyP95 на demo-chaos-svc: p95 2.0s, сервіс віддає 503"
  expected_root_cause: dependency
  expect_tools: [get_service, golden_signals, query_loki_patterns, get_deploys]
  fixtures:
    metrics:
      error_rate: {current: [0.02, 0.98, 1.0], baseline: [0.001]}
      latency_p95: {current: [0.12, 2.0, 2.0], baseline: [0.11]}
      rps: {current: [5.0], baseline: [5.0]}
      restarts: {current: [0], baseline: [0]}
      memory_bytes: {current: [91000000], baseline: [90000000]}
    logs:
      - {msg: "database connection timeout after 2000ms: dial tcp orders-db:5432: i/o timeout", count: 240}
    deploys: []
    k8s_events: [{minutes_ago: 3, reason: Unhealthy, type: Warning, message: "Readiness probe failed: orders-db timeout"}]

