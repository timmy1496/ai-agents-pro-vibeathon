# ---------- місткість ----------
- id: cap-01
  kind: rca
  intent: ALERT
  service: notification-worker
  input: "Черга росте 20 хвилин, вік найстарішого повідомлення 40 хвилин: публікація
    зросла з 20 до 200 повідомлень/с, кількість консюмерів не змінилась"
  expected_root_cause: capacity
  # без метрики глибини черги "unknown" теж чесна відповідь — не караємо за обережність
  acceptable_root_causes: [unknown]
  expect_tools: [get_service, golden_signals, similar_incidents, search_kb]
  fixtures:
    metrics:
      error_rate: {current: [0.0], baseline: [0.0]}
      latency_p95: {current: [1.9], baseline: [1.8]}
      rps: {current: [200.0], baseline: [20.0]}
      restarts: {current: [0], baseline: [0]}
      memory_bytes: {current: [80000000], baseline: [79000000]}
    logs: [{msg: "consumer lag growing", count: 50, level: warn}]
    deploys: []

