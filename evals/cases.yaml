# ---------- ресурси ----------
- id: res-01
  kind: rca
  intent: ALERT
  service: demo-chaos-svc
  input: "FrequentRestarts critical на demo-chaos-svc: 4 рестарти за 10 хвилин"
  expected_root_cause: resources
  expect_tools: [get_service, golden_signals, k8s_events, similar_incidents]
  fixtures:
    metrics:
      error_rate: {current: [0.02, 0.03], baseline: [0.001]}
      latency_p95: {current: [0.15], baseline: [0.12]}
      rps: {current: [5.0], baseline: [5.0]}
      restarts: {current: [0, 2, 4], baseline: [0]}
      memory_bytes: {current: [120000000, 200000000, 255000000], baseline: [90000000]}
    logs: [{msg: "memory ballast grew", count: 30, level: warn}]
    deploys: []
    k8s_events:
      - {minutes_ago: 6, reason: OOMKilling, type: Warning, message: "Memory cgroup out of memory: Killed process, limit 256Mi"}
      - {minutes_ago: 5, reason: BackOff, type: Warning, message: "Back-off restarting failed container chaos-svc"}

- id: res-02
  kind: rca
  intent: ALERT
  service: search-api
  input: "FrequentRestarts на search-api після викату v4.2.0, памʼять пилкою"
  expected_root_cause: resources
  # leak, що приїхав релізом — обидві відповіді чесні, і судити треба обидві
  acceptable_root_causes: [release]
  expect_tools: [get_service, golden_signals, k8s_events, get_deploys, similar_incidents]
  fixtures:
    metrics:
      error_rate: {current: [0.03], baseline: [0.002]}
      latency_p95: {current: [4.0, 0.5, 4.0], baseline: [0.4]}
      rps: {current: [80.0], baseline: [80.0]}
      restarts: {current: [3, 5], baseline: [0]}
      memory_bytes: {current: [400000000, 950000000, 1000000000], baseline: [380000000]}
    logs: [{msg: "aggregation cache size grew", count: 40, level: warn}]
    deploys: [{minutes_ago: 45, version: "4.2.0", author: dana}]
    k8s_events: [{minutes_ago: 8, reason: OOMKilling, type: Warning, message: "Killed process (java), limit 1Gi"}]

